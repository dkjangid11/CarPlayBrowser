name: Build CarPlayBrowser iOS IPA
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
jobs:
  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -eo pipefail
          xcodebuild build \
            -project CarPlayBrowser.xcodeproj \
            -scheme CarPlayBrowser \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Embed entitlements and package IPA
        run: |
          set -e
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/CarPlayBrowser.app"
          # An unsigned build carries no entitlements, so add the CarPlay one with ldid.
          ldid -SCarPlayBrowser.entitlements "$APP_PATH/CarPlayBrowser"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry CarPlayBrowser.ipa Payload)

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayBrowser-iOS-IPA
          path: build/CarPlayBrowser.ipa
