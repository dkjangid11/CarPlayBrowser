workflows:
  ios-build-unsigned:
    name: Build iOS CarPlay Browser (Unsigned for TrollStore)
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen ldid
          xcodegen generate
      - name: Build iOS App (Unsigned)
        script: |
          set -eo pipefail
          mkdir -p build/ios/ipa
          xcodebuild build \
            -project CarPlayBrowser.xcodeproj \
            -scheme CarPlayBrowser \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Embed entitlements and package IPA
        script: |
          set -e
          APP_DIR="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos"
          # An unsigned build carries no entitlements, so add the CarPlay one with ldid.
          ldid -S"$CM_BUILD_DIR/CarPlayBrowser.entitlements" "$APP_DIR/CarPlayBrowser.app/CarPlayBrowser"
          cd "$APP_DIR"
          rm -rf Payload CarPlayBrowser.ipa
          mkdir Payload
          cp -r CarPlayBrowser.app Payload/
          zip -qry CarPlayBrowser.ipa Payload
          cp CarPlayBrowser.ipa "$CM_BUILD_DIR/build/ios/ipa/"
    artifacts:
      - build/ios/ipa/*.ipa
